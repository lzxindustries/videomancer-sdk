# Stickfigure Program Configuration

[program]
program_id = "com.lzxindustries.stickfigure"
program_name = "Stickfigure"
program_version = "1.0.0"
abi_version = ">=1.0,<2.0"
author = "Lars Larsen"
license = "GPL-3.0"
categories = ["Edges", "Print"]
program_type = "processing"
description = "Reduces video to stick-figure line drawings via multi-axis edge detection with adjustable threshold and line weight"
hardware_compatibility = ["rev_b"]
core = "yuv444_30b"
url = "https://github.com/lzxindustries/videomancer-sdk"

[[parameter]]
parameter_id = "rotary_potentiometer_1"
name_label = "Threshold"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 80
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_2"
name_label = "Line Wt"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 400
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_3"
name_label = "Smooth"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 200
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_4"
name_label = "Fill Luma"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "rotary_potentiometer_5"
name_label = "Line Hue"
control_mode = "linear"
display_min_value = 0
display_max_value = 360
initial_value = 0
display_float_digits = 0
suffix_label = "°"

[[parameter]]
parameter_id = "rotary_potentiometer_6"
name_label = "Hue Sat"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 0
display_float_digits = 1
suffix_label = "%"

[[parameter]]
parameter_id = "toggle_switch_7"
name_label = "Edge Mode"
value_labels = ["Sobel", "Roberts"]
initial_value_label = "Sobel"

[[parameter]]
parameter_id = "toggle_switch_8"
name_label = "Invert"
value_labels = ["Dark Lines", "Light Lines"]
initial_value_label = "Dark Lines"

[[parameter]]
parameter_id = "toggle_switch_9"
name_label = "Color Edge"
value_labels = ["Luma", "Luma+Chroma"]
initial_value_label = "Luma"

[[parameter]]
parameter_id = "toggle_switch_10"
name_label = "Pre-Filter"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "toggle_switch_11"
name_label = "Posterize"
value_labels = ["Off", "On"]
initial_value_label = "Off"

[[parameter]]
parameter_id = "linear_potentiometer_12"
name_label = "Mix"
control_mode = "linear"
display_min_value = 0
display_max_value = 100
initial_value = 1023
display_float_digits = 1
suffix_label = "%"

[[preset]]
name = "Pencil"
rotary_potentiometer_1 = 80
rotary_potentiometer_2 = 300
rotary_potentiometer_3 = 300
rotary_potentiometer_4 = 1023

[[preset]]
name = "Bold Ink"
rotary_potentiometer_1 = 40
rotary_potentiometer_2 = 600
rotary_potentiometer_3 = 100
rotary_potentiometer_4 = 1023
toggle_switch_7 = 1

[[preset]]
name = "Neon Lines"
rotary_potentiometer_1 = 60
rotary_potentiometer_2 = 450
rotary_potentiometer_3 = 200
rotary_potentiometer_4 = 1023
rotary_potentiometer_5 = 600
rotary_potentiometer_6 = 800
toggle_switch_8 = 1

[[preset]]
name = "Blueprint"
rotary_potentiometer_1 = 70
rotary_potentiometer_2 = 350
rotary_potentiometer_3 = 400
rotary_potentiometer_4 = 100
rotary_potentiometer_5 = 682
rotary_potentiometer_6 = 700

[[preset]]
name = "Woodcut"
rotary_potentiometer_1 = 50
rotary_potentiometer_2 = 500
rotary_potentiometer_3 = 50
rotary_potentiometer_4 = 900
toggle_switch_11 = 1
